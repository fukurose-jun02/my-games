<!DOCTYPE html>
<html lang="ja">
<head>
<script>/* github.io で開かれたときは Cloudflare の同じページへ移動 */ if (location.hostname === "fukurose-jun02.github.io") location.replace("https://my-games.fukuchan-app.workers.dev" + location.pathname.replace(/^\/my-games/, "") + location.search + location.hash);</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>デリソバ・リバイバル</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="hud">
            <div class="hud-item">
                <span class="label">残り距離</span>
                <span id="distance">1000</span> m
            </div>
            <div class="hud-item">
                <span class="label">制限時間</span>
                <span id="time">60</span> 秒
            </div>
            <div class="hud-item">
                <span class="label">そば</span>
                <span id="soba-count">5</span>
            </div>
        </div>
        <canvas id="game-canvas" width="800" height="600"></canvas>
        <div id="message-overlay">
            <h1 id="message-title">START</h1>
            <p id="message-subtitle">タップ / Space でスタート</p>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
